<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="css/sign-up.css"/>
  <style>
    .field-error {
      color: #E24B4A;
      font-size: 11px;
      margin-bottom: 4px;
      display: none;
    }
    .field-error.show {
      display: block;
    }
    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      margin-bottom: 4px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .remember-me input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: #7F77DD;
      cursor: pointer;
    }
    .remember-me label {
      font-size: 12px;
      color: #888;
      cursor: pointer;
      user-select: none;
    }
    .forgot-pwd a {
      color: #7F77DD;
      text-decoration: none;
      font-size: 12px;
    }
    .welcome-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f3f2fd;
      border-left: 3px solid #7F77DD;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }
    .welcome-banner i {
      font-size: 22px;
      color: #7F77DD;
    }
    .welcome-banner div p:first-child {
      font-size: 14px;
      font-weight: 500;
      color: #7F77DD;
      margin: 0;
    }
    .welcome-banner div p:last-child {
      font-size: 11px;
      color: #888;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="left">
      <div>
        <img src="assets/img/logo.png" alt="Logo" class="profile-page-logo" />
      </div>
    </div>

    <div class="divider-v"></div>

    <div class="right">
      <h1 class="form-title">Welcome Back!</h1>
      <p class="form-sub">Sign in to continue with your account.<br></p>
      
      <p id="userError" style="color: #E24B4A; font-size: 13px;"></p>
      <p id="serverError" style="color: #E24B4A; font-size: 13px;"></p>

      <div class="field-wrap">
        <label class="field-label">Email</label>
        <p class="field-error" id="email-error"></p>
        <div class="input-row">
          <input type="email" id="email" placeholder="hello@example.com" autocomplete="on" />
        </div>
      </div>

      <div class="field-wrap">
        <label class="field-label">Password</label>
        <p class="field-error" id="pwd-error"></p>
        <div class="input-row">
          <input type="password" id="pwd" placeholder="Enter your password" autocomplete="off" />
          <button class="eye-btn" onclick="togglePwd()" aria-label="Toggle password">
            <i class="ti ti-eye"></i>
          </button>
        </div>
        <div class="options-row">
          <div class="remember-me">
            <input type="checkbox" id="rememberMe" />
            <label for="rememberMe">Remember me</label>
          </div>
          <p class="forgot-pwd">
            <a href="forgot-password.html">Forgot password?</a>
          </p>
        </div>
      </div>

      <button class="submit-btn" id="loginBtn">Sign in</button>
      <div class="social-row"></div>
      
      <p class="signup-row">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>
  </div>

  <div id="success"></div>
  <div id="backError"></div>

  <script>
    // Ensure scripts attach seamlessly after HTML renders safely
    document.addEventListener("DOMContentLoaded", () => {
      const pwdInput = document.getElementById('pwd');
      if (pwdInput) {
        pwdInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
      }

      // Pre-fill remembered email immediately if found
      const savedEmail = localStorage.getItem("savedEmail");
      if (savedEmail) {
        document.getElementById('email').value = savedEmail;
        document.getElementById('rememberMe').checked = true;
      }
    });

    function togglePwd() {
      const input = document.getElementById('pwd');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function showFieldError(fieldId, message) {
      const errorEl = document.getElementById(`${fieldId}-error`);
      if (errorEl) {
        errorEl.textContent = message;
        errorEl.classList.add('show');
      }
    }

    function clearFieldErrors() {
      document.querySelectorAll('.field-error').forEach(el => {
        el.textContent = '';
        el.classList.remove('show');
      });
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      clearFieldErrors();
      document.getElementById("userError").innerHTML = "";
      document.getElementById("serverError").innerHTML = "";

      const email = document.getElementById('email').value.trim();
      const pwd   = document.getElementById('pwd').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      let hasError = false;

      if (!email) {
        showFieldError('email', 'Email is required');
        hasError = true;
      }
      if (!pwd) {
        showFieldError('pwd', 'Password is required');
        hasError = true;
      }

      if (hasError) return;

      // Pass remember_me to match revised Pydantic schema
      const credentials = { email: email, password: pwd, remember_me: rememberMe };

      try {
        const base     = "http://127.0.0.1:8000";
        const endPoint = "/authenticate/";

        const response = await fetch(`${base}${endPoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",  
          body: JSON.stringify(credentials)
        });

        const status = await response.json();

        if (response.status === 200) {
          sessionStorage.setItem("Email", status.email);
          sessionStorage.setItem("Name", status.fname);

          // Local storage handling for the email field
          if (rememberMe) {
            localStorage.setItem("savedEmail", email);
            // alert(`Saved email to localStorage: ${email}`);
          } else {
            localStorage.removeItem("savedEmail");
            // alert(`Cleared email from localStorage: ${email}`);
          }

          window.location.href = "index.html";
          
        } else {
          document.getElementById("userError").innerHTML = ` ${status.detail || "Authentication failed."}`;
        }

      } catch (error) {
        document.getElementById("serverError").innerHTML = `Error: ${error.message}`;
      }
    });

    window.addEventListener("pageshow", function (event) {
      if (event.persisted) {
        window.location.reload();
      }
    });
  </script>
  
</body>
</html>
